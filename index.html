<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
    <title>image accordion</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrapper">
      <div class="container">
        <input type="radio" name="slide" id="c1" />
        <label for="c1" id="one" class="card">
          <div class="row">
            <div class="icon">1</div>
            <div class="description">
              <h4>Morning</h4>
              <p>
                The time of day when the sun rises and everything starts fresh.
              </p>
            </div>
          </div>
        </label>
        <input type="radio" name="slide" id="c2" checked />
        <label for="c2" class="card" id="two">
          <div class="row">
            <div class="icon">2</div>
            <div class="description">
              <h4>Afternoon</h4>
              <p>
                The bright part of the day after morning, when the sun is high
                in the sky.
              </p>
            </div>
          </div>
        </label>
        <input type="radio" name="slide" id="c3" checked />
        <label for="c3" class="card" id="three">
          <div class="row">
            <div class="icon">3</div>
            <div class="description">
              <h4>Evening</h4>
              <p>
                The time when the sun sets and the sky becomes orange or pink.
              </p>
            </div>
          </div>
        </label>
        <input type="radio" name="slide" id="c4" checked />
        <label for="c4" class="card" id="four">
          <div class="row">
            <div class="icon">4</div>
            <div class="description">
              <h4>Night</h4>
              <p>The dark time after evening when the world becomes quiet.</p>
            </div>
          </div>
        </label>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
